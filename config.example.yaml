# copy to sentinel.yaml and tweak
# all of these have sane defaults
# try --profile home, server, uploads, paranoid

path: "."
profile: ""
burst: 25
window: 10
cooldown: 30
entropy_line: 7.5
response: warn
webhook: ""
notify: false
kill: false

# vault keeps clean copies for restores
vault_max_mb: 5
vault_keep: 3

# quarantine cap in mb
quar_max_mb: 500

# procs never killed
allow: []

# per path tweaks
paths: []

# risk lines for check
risk_warn: 40
risk_high: 70

# local web view
serve_port: 8000

# mail, blank means off
mail_to: ""
mail_from: "sentinel@localhost"
smtp_host: "localhost"
smtp_port: 25

# extra ignore globs on top of .sentinelignore
ignore:
  - "*.tmp"
  - "*.log"
